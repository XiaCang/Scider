name: Backend CI/CD

on:
  push:
    branches: [dev, main]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-cicd.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-cicd.yml'

defaults:
  run:
    working-directory: src/backend

jobs:
  # ──────────────────────────────────────────────
  # Test (runs on every push/PR)
  # ──────────────────────────────────────────────
  test:
    if: |
      always() &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 218218wcj
          MYSQL_DATABASE: db
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -p218218wcj"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --timeout=60
        env:
          DATABASE_URL: mysql+asyncmy://root:218218wcj@127.0.0.1:3306/db?charset=utf8mb4
          REDIS_BROKER_URL: redis://127.0.0.1:6379/0
          REDIS_RESULT_BACKEND: redis://127.0.0.1:6379/1

  # ──────────────────────────────────────────────
  # Build & Push Docker Images
  # ──────────────────────────────────────────────
  build-and-push:
    needs: test
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image tags per branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "TAG_BACKEND=main" >> $GITHUB_ENV
            echo "TAG_WORKER=worker-main" >> $GITHUB_ENV
          else
            echo "TAG_BACKEND=dev" >> $GITHUB_ENV
            echo "TAG_WORKER=worker-dev" >> $GITHUB_ENV
          fi
          echo "SHA_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend API image ──
      - name: Build & push backend API image
        uses: docker/build-push-action@v5
        with:
          context: src/backend
          push: true
          platforms: linux/amd64
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple/
          tags: |
            ghcr.io/xiacang/software-scider/backend:${{ env.TAG_BACKEND }}
            ghcr.io/xiacang/software-scider/backend:sha-${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Celery Worker image ──
      - name: Build & push Celery worker image
        uses: docker/build-push-action@v5
        with:
          context: src/backend
          push: true
          platforms: linux/amd64
          file: src/backend/Dockerfile.worker
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple/
          tags: |
            ghcr.io/xiacang/software-scider/worker:${{ env.TAG_WORKER }}
            ghcr.io/xiacang/software-scider/worker:sha-${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Deploy
  # ──────────────────────────────────────────────
  deploy:
    needs: build-and-push
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Determine deploy env & compose file
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "DEPLOY_ENV=production" >> $GITHUB_ENV
            echo "COMPOSE_FILE=docker-compose.prod.yml" >> $GITHUB_ENV
            echo "SSH_HOST=${{ secrets.PROD_SERVER_IP }}" >> $GITHUB_ENV
            echo "SSH_USER=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
            echo "COMPOSE_FILE=docker-compose.yml" >> $GITHUB_ENV
            echo "SSH_HOST=${{ secrets.SERVER_IP }}" >> $GITHUB_ENV
            echo "SSH_USER=${{ secrets.SERVER_USER }}" >> $GITHUB_ENV
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_PAT
          command_timeout: 5m
          script: |
            set -e
            cd /opt/scider

            # Login to GHCR so we can pull private images
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull latest images (built & pushed by build-and-push job)
            docker compose -f ${{ env.COMPOSE_FILE }} pull backend worker

            # Apply DB migrations before restarting
            docker compose -f ${{ env.COMPOSE_FILE }} run --rm backend \
              sh -c "cd db && alembic upgrade head"

            # Restart services
            docker compose -f ${{ env.COMPOSE_FILE }} up -d backend worker

            # Clean up stale images
            docker image prune -af --filter "until=24h"

            echo "Deploy to ${{ env.DEPLOY_ENV }} complete."
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
