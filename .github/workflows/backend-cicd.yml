name: Backend CI/CD

on:
  push:
    branches: [dev, main]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-cicd.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-cicd.yml'

defaults:
  run:
    working-directory: src/backend

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # Tests (with MySQL & Redis service containers)
  # ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: scider_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Alembic migrations
        run: |
          cp .env.example .env
          export DATABASE_URL="mysql+asyncmy://root:testpass@localhost:3306/scider_test?charset=utf8mb4"
          cd db && alembic upgrade head
        env:
          DATABASE_URL: mysql+asyncmy://root:testpass@localhost:3306/scider_test?charset=utf8mb4

      - name: Run tests with pytest
        run: pytest --maxfail=3 --disable-warnings -v -x
        env:
          DATABASE_URL: mysql+asyncmy://root:testpass@localhost:3306/scider_test?charset=utf8mb4
          REDIS_BROKER_URL: redis://localhost:6379/0
          REDIS_RESULT_BACKEND: redis://localhost:6379/1
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ""
          EMBEDDING_API_KEY: ""

  # ──────────────────────────────────────────────
  # Build & Push Docker Images
  # ──────────────────────────────────────────────
  build-and-push:
    needs: [test]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository
        run: echo "REPO_LOWER=${REPO,,}" >> $GITHUB_ENV
        env:
          REPO: ${{ github.repository }}

      - name: Set image tags per branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "TAG_BACKEND=main" >> $GITHUB_ENV
            echo "TAG_WORKER=worker-main" >> $GITHUB_ENV
          else
            echo "TAG_BACKEND=dev" >> $GITHUB_ENV
            echo "TAG_WORKER=worker-dev" >> $GITHUB_ENV
          fi
          echo "SHA_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend API image ──
      - name: Build & push backend API image
        uses: docker/build-push-action@v5
        with:
          context: src/backend
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ env.TAG_BACKEND }}
            ghcr.io/${{ env.REPO_LOWER }}/backend:sha-${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Celery Worker image ──
      - name: Build & push Celery worker image
        uses: docker/build-push-action@v5
        with:
          context: src/backend
          push: true
          platforms: linux/amd64
          file: src/backend/Dockerfile.worker
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/worker:${{ env.TAG_WORKER }}
            ghcr.io/${{ env.REPO_LOWER }}/worker:sha-${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Deploy
  # ──────────────────────────────────────────────
  deploy:
    needs: build-and-push
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository
        run: echo "REPO_LOWER=${REPO,,}" >> $GITHUB_ENV
        env:
          REPO: ${{ github.repository }}

      - name: Determine deploy env & compose file
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "DEPLOY_ENV=production" >> $GITHUB_ENV
            echo "COMPOSE_FILE=docker-compose.prod.yml" >> $GITHUB_ENV
            echo "SSH_HOST=${{ secrets.PROD_SERVER_IP }}" >> $GITHUB_ENV
            echo "SSH_USER=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
            echo "COMPOSE_FILE=docker-compose.yml" >> $GITHUB_ENV
            echo "SSH_HOST=${{ secrets.SERVER_IP }}" >> $GITHUB_ENV
            echo "SSH_USER=${{ secrets.SERVER_USER }}" >> $GITHUB_ENV
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/scider

            # Pull latest images
            docker compose -f ${{ env.COMPOSE_FILE }} pull backend worker

            # Apply DB migrations before restarting
            echo "Running database migrations..."
            docker compose -f ${{ env.COMPOSE_FILE }} run --rm backend \
              sh -c "cd db && alembic upgrade head"

            # Restart services
            docker compose -f ${{ env.COMPOSE_FILE }} up -d backend worker

            # Clean up stale images
            docker image prune -af --filter "until=24h"

            echo "Deploy to ${{ env.DEPLOY_ENV }} complete."
